<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 250" width="860" height="250" role="img" aria-label="GeminiHunter" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF2A2A"/>
      <stop offset="0.55" stop-color="#D3122B"/>
      <stop offset="1" stop-color="#C4162A"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b0a0f"/>
      <stop offset="1" stop-color="#5a1019"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A7A"/>
      <stop offset="1" stop-color="#FF2A2A"/>
    </linearGradient>
  </defs>

  <!-- wordmark -->
  <text x="30" y="145" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="82" font-weight="800"
        fill="url(#word)" textLength="670" lengthAdjust="spacingAndGlyphs">GeminiHunter</text>

  <!-- magnifier handle -->
  <line x1="772" y1="146" x2="822" y2="206" stroke="url(#word)" stroke-width="14" stroke-linecap="round"/>

  <!-- magnifier ring + lens -->
  <circle cx="745" cy="108" r="52" fill="url(#lens)" stroke="url(#word)" stroke-width="10"/>
  <circle cx="745" cy="108" r="40" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>

  <!-- Gemini-style sparkle -->
  <g transform="translate(745 108)">
    <path d="M0,-32 C2,-12 12,-2 32,0 C12,2 2,12 0,32 C-2,12 -12,2 -32,0 C-12,-2 -2,-12 0,-32 Z" fill="url(#spark)"/>
  </g>
  <!-- glint -->
  <path d="M716 86 A36 36 0 0 1 738 70" stroke="#ffffff" stroke-opacity="0.45" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- divider + tagline -->
  <line x1="30" y1="182" x2="830" y2="182" stroke="#D3122B" stroke-opacity="0.35" stroke-width="1.5"/>
  <text x="430" y="214" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
        font-size="17" font-weight="600" letter-spacing="4" fill="#8A8F98">GEMINI API KEY DISCOVERY &amp; SECURITY SCANNING</text>
</svg>
